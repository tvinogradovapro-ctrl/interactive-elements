<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Упражнение: 1.1 и 1.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #FFFFFF;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .exercise {
      width: 100%;
      max-width: 780px;
    }

    .exercise-title {
      font-size: 20px;
      font-weight: 600;
      color: #0F172A;
      text-align: left;
      margin-bottom: 24px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
    }

    /* Карточка без лишних рамок и подложек */
    .card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      outline: none;
    }

    /* Контейнер повторяет форму самой картинки */
    .media-box {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 24px;
      overflow: hidden;
      background-color: #FFFFFF;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.28s ease;
    }

    .media-box img,
    .media-box svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Увеличение и мягкая подсветка при наведении */
    .card:hover .media-box,
    .card:focus-visible .media-box {
      transform: scale(1.03);
      box-shadow: 0 14px 32px rgba(242, 84, 48, 0.22);
    }

    /* Акцент при выборе карточки */
    .card.selected .media-box {
      transform: scale(1.02);
      box-shadow: 0 14px 36px rgba(242, 84, 48, 0.32);
    }

    .card-caption {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 500;
      color: #334155;
      text-align: left;
      transition: color 0.2s ease;
    }

    .card:hover .card-caption {
      color: #0F172A;
    }

    .card.selected .card-caption {
      color: #F25430;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .cards-grid {
        grid-template-columns: 1fr;
        gap: 24px;
      }
    }
  </style>
</head>
<body>

  <main class="exercise">
    <h1 class="exercise-title">Выберите карточку</h1>

    <section class="cards-grid" aria-label="Карточки выбора">
      <!-- Карточка 1: src="1.1.png" -->
      <article class="card" onclick="selectCard(this)" tabindex="0" role="button">
        <div class="media-box">
          <img 
            src="1.1.png" 
            alt="POV покупатель: Когда хотел просто купить новую сковородку, а обнаружил себя мечтающим о новой кухне"
            onerror="renderFallbackSVG(this, '1.1')"
          >
        </div>
        <div class="card-caption"></div>
      </article>

      <!-- Карточка 2: src="1.2.png" -->
      <article class="card" onclick="selectCard(this)" tabindex="0" role="button">
        <div class="media-box">
          <img 
            src="1.2.png" 
            alt="POV продавец: Когда клиент хотел купить новую сковородку, а ты убедил его в том, что новая сковородка ни к чему на старой кухне..."
            onerror="renderFallbackSVG(this, '1.2')"
          >
        </div>
        <div class="card-caption"></div>
      </article>
    </section>
  </main>

  <script>
    // Автоматически подтягиваем названия из атрибута src (убирая расширение)
    document.querySelectorAll('.card').forEach((card) => {
      const img = card.querySelector('img');
      const caption = card.querySelector('.card-caption');
      const rawSrc = decodeURIComponent(img.getAttribute('src') || '');
      const cleanTitle = rawSrc.split('/').pop().replace(/\.[^/.]+$/, '');

      caption.textContent = cleanTitle;
      card.setAttribute('aria-label', cleanTitle);
    });

    // Выделение активной карточки по клику или с клавиатуры
    function selectCard(selectedCard) {
      document.querySelectorAll('.card').forEach((c) => c.classList.remove('selected'));
      selectedCard.classList.add('selected');
    }

    document.querySelectorAll('.card').forEach((card) => {
      card.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          selectCard(card);
        }
      });
    });

            <path d="M322,148 C302,144 282,158 276,174 C272,184 286,188 302,182 C318,176 332,170 342,162 Z" fill="#F09B48" stroke="#8C3D2B" stroke-width="1.5"/>
            <g transform="translate(262, 114) rotate(-24)">
              <polygon points="-46,-20 -38,-58 -14,-32" fill="#F09B48"/>

            <text x="250" y="420" text-anchor="middle" fill="#231815" font-family="Inter, sans-serif" font-size="16" font-weight="500">

</body>
</html>
